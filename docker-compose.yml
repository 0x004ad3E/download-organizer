services:
  download-organizer:
    build: .
    container_name: download-organizer
    user: "1000:1000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # this is the path where download-organizer folder is located from the repository qbittorrent-gluetun-protonvpn
      - /path/to/download-organizer:/config
      # under /path/to/new/location is the location where the downloaded content will be moved.
      # additionally here create a subfolder toor and under toor 2 subfolders, movies and series
      # the downladed content will be moved into toor/movies or toor/series
      - /path/to/new/location:/usb-drive-tsba
      # refer rss-parser repository
      - /path/to/rss-parser/output:/rss-parser
      
